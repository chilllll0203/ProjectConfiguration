<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/static/style_settings.css">
    <title>Настройки</title>
</head>
<body>
<header>
    <h1>Личный Кабинет</h1>
    <div class="menu-form">
        <a href="/profile">Главная</a>
        <a href="">Просмотреть все мероприятия</a>
        <a href="">Добавить мероприятие</a>
        <a href="/settings">Настройки</a>
    </div>
</header>
<main>
    <form action="/settingsteacher" method="post" class="settings-information">
        <text>Имя пользователя: {{username}}</text>
        <text>Почта пользователя: {{email}}</text>
        <button type="submit" name="changepassword" value="change">Сменить пароль</button>
        <button type="submit" name="exitaccount" value="exit">Выйти из аккаунта</button>
    </form>
</main>
</body>
</html>
