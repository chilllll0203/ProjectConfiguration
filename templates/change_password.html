<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/css/style_changepassword.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Смена пароля</title>
</head>
<body>
    <main>
        <h1>Смена пароля</h1>
        <form action="/change_password" method="post" class="change_password">
        <label for="current_password">Введите ваш текущий пароль:</label>
        <input type="text" id="current_password" name="current_password" required><br><br>

        <label for="new_password">Введите новый пароль:</label>
        <input type="new_password" id="new_password" name="new_password" required><br><br>

        <button type="submit" name="button_change" value="button_change">Сменить пароль</button>
    </form>
    </main>
</body>
</html>
